{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Delete {{ product.name }}?</h2>
  <p>This cannot be undone.</p>
  <form method="post">{% csrf_token %}
    <button class="btn">Yes, delete</button>
    <a href="{% url 'product_detail' product.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
